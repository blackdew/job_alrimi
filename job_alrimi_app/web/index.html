<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="남해군 일자리·빈집 정보를 실시간으로 받아보세요">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Open Graph 메타태그 (SNS 공유용) -->
  <meta property="og:title" content="남해 일자리·빈집 알리미">
  <meta property="og:description" content="남해군 일자리와 빈집 정보를 실시간으로 받아보세요">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="남해 알리미">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>남해 알리미</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Firebase Messaging Service Worker 등록 -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/firebase-messaging-sw.js')
          .then(function(registration) {
            console.log('Firebase Messaging SW registered:', registration.scope);
          })
          .catch(function(err) {
            console.log('Firebase Messaging SW registration failed:', err);
          });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
